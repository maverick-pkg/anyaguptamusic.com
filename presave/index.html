  document.head.appendChild(s);

  // Spotify or Apple Music, or the all-platforms page), or else as its platform. Sign-up = the /subscribed/ page.
  var C = { signup: 'AW-18460647258/M3naCL6nioAdENq-3OJE', album: 'AW-18460647258/8WyACMenioAdENq-3OJE',

  document.addEventListener('click', function(e){
    var a = e.target && e.target.closest ? e.target.closest('a[href]') : null; if (!a) return;
    var h = a.href;
    if (/open\.spotify\.com\/album\/1IdpXvka3fAaIqdnWEMnot|distrokid\.com\/hyperfollow\//.test(h) ||
        (/music\.apple\.com\/[^?#]*\/album\/[^?#]*\/6802154894/.test(h) && !/[?&]i=/.test(h))) conv('album');
    else if (/open\.spotify\.com\//.test(h)) conv('spotify');
    else if (/music\.apple\.com\//.test(h)) conv('apple');
  }, true);
  // Meta pixel. 'autoConfig' false BEFORE init is what turns automatic advanced matching off in the page:
  // left on, it reads the address typed into the mailing-list form and sends it to Meta, which our privacy
  // page promises happens only when the visitor ticks the box. Page views only — no events asked for yet.
  !function(f,b,e,v,n,t,s)

  'https://connect.facebook.net/en_US/fbevents.js');
