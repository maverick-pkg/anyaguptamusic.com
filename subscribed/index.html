<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>You’re on the list — Anya Gupta</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,900&family=Caveat:wght@600&family=Karla:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--blush:#f6ded6;--paper:#faf6ee;--ink:#211d20;--ink-soft:#4c4449;--peach-deep:#e08454}
*{margin:0;padding:0;box-sizing:border-box}
html{overflow-x:hidden;overflow-x:clip}
body{font-family:Karla,"Avenir Next",Avenir,"Helvetica Neue",Arial,sans-serif;background:var(--blush);color:var(--ink);min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:2rem;text-align:center;line-height:1.6}
.card{background:var(--paper);box-shadow:0 14px 34px rgba(60,34,28,.16);padding:clamp(1.8rem,5vw,3rem);max-width:560px}
h1{font-family:"Playfair Display",Didot,Georgia,serif;font-style:italic;font-weight:900;font-size:clamp(2.2rem,8vw,3.2rem);line-height:1.05;margin-bottom:.3em;background:linear-gradient(120deg,#b85a28,#c96a3a 55%,#8f6e30);-webkit-background-clip:text;background-clip:text;color:transparent}
.script{font-family:Caveat,cursive;font-weight:600;font-size:1.5rem;color:#c96a3a;display:block;margin-bottom:1.2rem}
p{color:var(--ink-soft);margin-bottom:1.4rem}
.row{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap}
.btn{display:inline-block;text-decoration:none;font-weight:700;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;padding:.95em 1.6em;border:2px solid var(--ink);color:var(--ink)}
.btn-solid{background:var(--ink);color:var(--paper)}
.btn:hover{background:var(--peach-deep);border-color:var(--peach-deep);color:var(--paper)}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<main class="card">
  <h1>You’re on the list</h1>
  <span class="script">thank you for being here first ✦</span>
  <p>Album news, show dates, and first listens — a few emails a year, no noise. The debut album <b>Becoming</b> arrives September 18.</p>
  <div class="row">
    <a class="btn btn-solid" href="https://distrokid.com/hyperfollow/anyagupta1/becoming">Pre-save the album</a>
    <a class="btn" href="/">Back to the site</a>
  </div>
</main>
<script data-goatcounter="https://anyaguptamusic.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<script>
// the page view itself is the confirmation metric; also emit a named event once count.js is ready
(function(){ var n = 0; (function tick(){ if (window.goatcounter && goatcounter.count) { goatcounter.count({path:'newsletter-confirmed', event:true}); } else if (n++ < 15) setTimeout(tick, 200); })(); })();
</script>
</body>
</html>
